<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Todos os produtos Titã Sports — Luvas, proteções e acessórios para luta.">
  <title>Produtos — Titã Sports</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="header">
  <nav class="nav container">
    <a href="index.html" class="logo">
      <span class="logo-icon">T</span>
      <div class="logo-text">
        <span class="logo-name">TITÃ <strong>SPORTS</strong></span>
        <span class="logo-tagline">Supere Seus Limites</span>
      </div>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Início</a></li>
      <li><a href="produtos.html" class="active">Produtos</a></li>
      <li><a href="index.html#sobre">Sobre</a></li>
      <li><a href="index.html#contato">Contato</a></li>
      <li><a href="admin.html" class="admin-link">Admin</a></li>
    </ul>
    <a href="#" id="navWhats" class="btn btn-primary" target="_blank" rel="noopener">WhatsApp</a>
  </nav>
</header>

<!-- ===== HERO DA PÁGINA ===== -->
<section class="produtos-hero">
  <div class="container">
    <h1>TODOS OS <span class="highlight">PRODUTOS</span></h1>
    <p>Equipamentos profissionais para boxe, MMA, Muay Thai e muito mais</p>
  </div>
</section>

<!-- ===== PRODUTOS ===== -->
<section class="produtos-section">
  <div class="container">

    <!-- Filtros -->
    <div class="filters">
      <input
        type="search"
        id="searchInput"
        placeholder="🔍  Buscar produto..."
        autocomplete="off"
      >
      <select id="catFilter">
        <option value="">Todas as categorias</option>
      </select>
    </div>

    <!-- Grid de produtos -->
    <div id="productsGrid" class="grid"></div>

    <!-- Mensagem de lista vazia -->
    <p id="emptyMsg">Nenhum produto encontrado. Tente outro filtro.</p>

  </div>
</section>

<!-- ===== FOOTER ===== -->
<footer>
  <div class="container">
    <p>© 2026 <strong>Titã Sports</strong>. Todos os direitos reservados.</p>
  </div>
</footer>

<script src="js/data.js"></script>
<script>
(function () {
  const s = DB.getSettings();
  const whatsUrl = `https://wa.me/${s.whatsapp}`;

  // WhatsApp no nav
  const navWhats = document.getElementById('navWhats');
  if (navWhats) navWhats.href = whatsUrl;

  const allProducts = DB.getProducts();
  const grid        = document.getElementById('productsGrid');
  const emptyMsg    = document.getElementById('emptyMsg');
  const searchInput = document.getElementById('searchInput');
  const catFilter   = document.getElementById('catFilter');

  // Populate category select
  const cats = [...new Set(allProducts.map(p => p.categoria).filter(Boolean))].sort();
  cats.forEach(cat => {
    const opt = document.createElement('option');
    opt.value = cat;
    opt.textContent = cat;
    catFilter.appendChild(opt);
  });

  function escHtml(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function cardHTML(p) {
    const media = p.mediaType === 'video'
      ? `<video src="${p.imagem}" autoplay muted loop playsinline></video>`
      : `<img src="${escHtml(p.imagem)}" alt="${escHtml(p.nome)}" loading="lazy">`;
    return `
      <article class="card">
        ${media}
        <div class="card-body">
          <span class="tag">${escHtml(p.categoria)}</span>
          <h3>${escHtml(p.nome)}</h3>
          <p>${escHtml(p.descricao)}</p>
          <strong>R$ ${p.preco.toFixed(2).replace('.', ',')}</strong>
          <a href="${escHtml(p.link)}" target="_blank" rel="noopener" class="btn btn-primary">
            Comprar
          </a>
        </div>
      </article>`;
  }

  function render() {
    const q   = searchInput.value.toLowerCase().trim();
    const cat = catFilter.value;

    const filtered = allProducts.filter(p => {
      const matchName = !q || p.nome.toLowerCase().includes(q) || p.descricao.toLowerCase().includes(q);
      const matchCat  = !cat || p.categoria === cat;
      return matchName && matchCat;
    });

    if (filtered.length === 0) {
      grid.innerHTML = '';
      emptyMsg.style.display = 'block';
    } else {
      emptyMsg.style.display = 'none';
      grid.innerHTML = filtered.map(cardHTML).join('');
    }
  }

  searchInput.addEventListener('input', render);
  catFilter.addEventListener('change', render);

  // Render initial
  render();
})();
</script>
</body>
</html>
